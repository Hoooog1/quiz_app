name: Build Executables

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch:  # 允许手动触发

jobs:
  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Build Windows executable
      shell: cmd
      run: |
        python -m PyInstaller --name="简易答题软件" --windowed --onefile ^
          --add-data="example_questions.xlsx;." ^
          --add-data="example_questions.json;." ^
          --hidden-import=PySide6.QtCore ^
          --hidden-import=PySide6.QtGui ^
          --hidden-import=PySide6.QtWidgets ^
          --hidden-import=openpyxl ^
          --hidden-import=openpyxl.cell._writer ^
          --collect-all=openpyxl ^
          --noconfirm ^
          main.py
          
    - name: Upload Windows executable
      uses: actions/upload-artifact@v4
      with:
        name: windows-executable
        path: dist/简易答题软件.exe
        retention-days: 30

  build-macos:
    name: Build macOS Executable
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        python3 -m pip install --upgrade pip
        pip3 install -r requirements.txt
        
    - name: Build macOS executable
      run: |
        python3 -m PyInstaller --name="简易答题软件" --windowed --onedir \
          --add-data="example_questions.xlsx:." \
          --add-data="example_questions.json:." \
          --hidden-import=PySide6.QtCore \
          --hidden-import=PySide6.QtGui \
          --hidden-import=PySide6.QtWidgets \
          --hidden-import=openpyxl \
          --hidden-import=openpyxl.cell._writer \
          --collect-all=openpyxl \
          --noconfirm \
          main.py
          
    - name: Create DMG (optional)
      run: |
        hdiutil create -volname "简易答题软件" -srcfolder "dist/简易答题软件.app" -ov -format UDZO "dist/简易答题软件.dmg" || echo "DMG creation skipped"
        
    - name: Upload macOS executable
      uses: actions/upload-artifact@v4
      with:
        name: macos-executable
        path: |
          dist/简易答题软件.app
          dist/简易答题软件.dmg
        retention-days: 30

